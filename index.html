<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat Web</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for React, Lucide Icons, and Firebase -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
    </script>
    
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #020617; color: white; }
    </style>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#22c55e">
</head>
<body>
    <div id="root"></div>

    <!-- Main React Application Logic -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { 
          getAuth, 
          signInAnonymously, 
          signInWithCustomToken, 
          onAuthStateChanged
        } from 'firebase/auth';
        import { 
          getFirestore, 
          collection, 
          onSnapshot, 
          doc, 
          setDoc, 
          getDoc,
          deleteDoc,
          updateDoc
        } from 'firebase/firestore';
        import { 
          Search, MessageSquare, Send, Zap, EyeOff, Eye,
          ArrowLeft, LogOut, Sparkles, Settings, Trash2, Check,
          UserCircle, Palette, Info, Heart, Camera, Bell
        } from 'lucide-react';

        // --- Firebase Initialization ---
        // Safely access global variables injected by the environment, or default to empty
        const firebaseConfig = typeof window.__firebase_config !== 'undefined' && window.__firebase_config ? JSON.parse(window.__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'nexus-chat-default';

        // Helper to generate a consistent thread ID between two users
        const getThreadId = (uid1, uid2) => {
          return [uid1, uid2].sort().join('_');
        };

        const AVATAR_COLORS = [
          'bg-indigo-600', 'bg-red-600', 'bg-green-600', 
          'bg-pink-600', 'bg-yellow-600', 'bg-purple-600',
          'bg-teal-600', 'bg-orange-600', 'bg-slate-700'
        ];

        const AVATAR_ICONS = ['👽', '👻', '🤖', '🦊', '🐱', '🐶', '🐼', '🐯', '🐸', '🦄', '💀', '🔥', '✨', '⚡'];

        const APP_THEMES = {
          default: { bg: 'bg-slate-950', panel: 'bg-slate-900', border: 'border-slate-800', name: 'Slate Dark' },
          obsidian: { bg: 'bg-black', panel: 'bg-zinc-900', border: 'border-zinc-800', name: 'Obsidian Black' },
          midnight: { bg: 'bg-blue-950', panel: 'bg-blue-900', border: 'border-blue-800', name: 'Midnight Blue' },
        };

        // --- Sub-components ---

        // Unified Avatar Component to handle Images, Icons, and Initials
        const Avatar = ({ user, size = 'md', className = '', onClick }) => {
          const sizeClasses = {
            sm: 'w-10 h-10 text-lg',
            md: 'w-12 h-12 text-xl',
            lg: 'w-32 h-32 text-6xl'
          };
          const baseClasses = `${sizeClasses[size]} rounded-full flex items-center justify-center font-bold shadow-md flex-shrink-0 object-cover ${onClick ? 'cursor-pointer transition-transform hover:scale-105' : ''} ${className}`;

          if (user?.customAvatarUrl) {
            return <img src={user.customAvatarUrl} alt={user?.username} className={baseClasses} onClick={onClick} />;
          }
          return (
            <div className={`${baseClasses} ${user?.avatarColor || 'bg-slate-700'} text-white`} onClick={onClick}>
              {user?.avatarIcon || String(user?.username || '?').charAt(0).toUpperCase()}
            </div>
          );
        };

        const WhisperBubble = ({ msg, currentUserId, onDelete }) => {
          const [revealed, setRevealed] = useState(false);
          const [destroyed, setDestroyed] = useState(false);
          const duration = msg.whisperDuration || 5;
          const [timeLeft, setTimeLeft] = useState(duration);
          const isMe = msg.senderId === currentUserId;

          useEffect(() => {
            let timer;
            if (revealed && !destroyed && !isMe) {
              timer = setInterval(() => {
                setTimeLeft(prev => {
                  if (prev <= 1) {
                    setDestroyed(true);
                    clearInterval(timer);
                    // Permanently delete from database when timer hits 0
                    onDelete(msg.id);
                    return 0;
                  }
                  return prev - 1;
                });
              }, 1000);
            }
            return () => clearInterval(timer);
          }, [revealed, destroyed, isMe, msg.id, onDelete]);

          if (destroyed) {
            return (
              <div className={`p-3 rounded-2xl max-w-[80%] my-1 border border-dashed border-gray-600 bg-transparent text-gray-500 italic ${isMe ? 'self-end rounded-tr-sm' : 'self-start rounded-tl-sm'}`}>
                This whisper vanished into the void.
              </div>
            );
          }

          if (!revealed && !isMe) {
            return (
              <div 
                onClick={() => setRevealed(true)}
                className={`p-3 rounded-2xl max-w-[80%] my-1 cursor-pointer bg-slate-800 text-purple-400 border border-purple-500/50 flex items-center gap-2 self-start rounded-tl-sm transition-all hover:bg-slate-700`}
              >
                <EyeOff size={18} />
                <span className="font-medium">Tap to reveal whisper ({duration}s)</span>
              </div>
            );
          }

          return (
            <div className={`relative group p-3 rounded-2xl max-w-[80%] my-1 flex flex-col ${isMe ? 'bg-purple-900 text-white self-end rounded-tr-sm' : 'bg-slate-800 text-purple-100 self-start rounded-tl-sm border border-purple-500/50'}`}>
              <div className="flex items-center gap-2 mb-1 opacity-70 text-xs">
                <EyeOff size={12} />
                <span>Whisper Mode</span>
                {!isMe && <span className="ml-auto text-red-400 font-bold">{timeLeft}s</span>}
              </div>
              <div>{typeof msg.text === 'string' ? msg.text : String(msg.text)}</div>
              
              {isMe && (
                <button 
                  onClick={() => onDelete(msg.id)}
                  className="absolute -left-10 top-1/2 -translate-y-1/2 p-2 text-slate-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                  title="Delete message early"
                >
                  <Trash2 size={16} />
                </button>
              )}
            </div>
          );
        };

        // --- Main App Component ---
        function App() {
          // Firebase Auth State
          const [fbUser, setFbUser] = useState(null);
          const [authInitialized, setAuthInitialized] = useState(false);
          
          // App-level Virtual Login State
          const [userProfile, setUserProfile] = useState(null);
          const [allUsers, setAllUsers] = useState([]);
          const [authScreen, setAuthScreen] = useState('intro'); // intro, login, register
          const [authError, setAuthError] = useState('');
          const [loginForm, setLoginForm] = useState({ username: '', password: '' });
          const [showPassword, setShowPassword] = useState(false);

          // App Data State
          const [threads, setThreads] = useState([]);
          const [activeThreadId, setActiveThreadId] = useState(null);
          const [messages, setMessages] = useState([]);
          const [searchQuery, setSearchQuery] = useState('');
          
          const prevThreadsRef = useRef(null);
          const activeThreadRef = useRef(activeThreadId);
          const [notifPermission, setNotifPermission] = useState(
            typeof window.Notification !== 'undefined' ? window.Notification.permission : 'default'
          );

          // Keep ref synced for notification logic
          useEffect(() => {
            activeThreadRef.current = activeThreadId;
          }, [activeThreadId]);
          
          // UI State
          const [view, setView] = useState('inbox'); // inbox, search, chat, profile-settings, app-settings, view-profile
          const [isWhisperMode, setIsWhisperMode] = useState(false);
          const [whisperTimer, setWhisperTimer] = useState(5); // 5, 10, or 30
          const [messageInput, setMessageInput] = useState('');
          const [isBuzzed, setIsBuzzed] = useState(false);
          const [viewingProfileUid, setViewingProfileUid] = useState(null);
          
          // Settings Form State
          const [editBio, setEditBio] = useState('');
          const [editColor, setEditColor] = useState('');
          const [editIcon, setEditIcon] = useState('');
          const [editCustomImage, setEditCustomImage] = useState('');
          const [appThemeKey, setAppThemeKey] = useState('default');

          const messagesEndRef = useRef(null);
          const fileInputRef = useRef(null);

          const themeClasses = APP_THEMES[appThemeKey] || APP_THEMES['default'];

          // --- Strict Firebase Connection ---
          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                  await signInWithCustomToken(auth, window.__initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (err) {
                console.error("Firebase Auth error:", err);
              }
            };
            initAuth();

            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              setFbUser(currentUser);
              setAuthInitialized(true);
            });
            return () => unsubscribe();
          }, []);

          // Fetch All Users
          useEffect(() => {
            if (!fbUser) return;
            const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
            const unsub = onSnapshot(usersRef, (snap) => {
              const usersData = snap.docs.map(d => d.data());
              setAllUsers(usersData);
            }, (err) => console.error("Users fetch error:", err));
            return () => unsub();
          }, [fbUser]);

          // Keep Virtual Profile Synced
          useEffect(() => {
            if (userProfile && allUsers.length > 0) {
              const updatedProfile = allUsers.find(u => u.uid === userProfile.uid);
              if (updatedProfile && JSON.stringify(updatedProfile) !== JSON.stringify(userProfile)) {
                setUserProfile(updatedProfile);
                setEditBio(updatedProfile.bio || '');
                setEditColor(updatedProfile.avatarColor || 'bg-indigo-600');
                setEditIcon(updatedProfile.avatarIcon || '');
                setEditCustomImage(updatedProfile.customAvatarUrl || '');
              }
            }
          }, [allUsers, userProfile]);

          // Fetch User's Threads
          useEffect(() => {
            if (!fbUser || !userProfile) return;
            const threadsRef = collection(db, 'artifacts', appId, 'public', 'data', 'threads');
            const unsub = onSnapshot(threadsRef, (snap) => {
              const allThreadsData = snap.docs.map(d => d.data());
              const myThreads = allThreadsData.filter(t => t.participants && t.participants.includes(userProfile.uid));
              myThreads.sort((a, b) => b.updatedAt - a.updatedAt);
              setThreads(myThreads);

              if (prevThreadsRef.current !== null) {
                myThreads.forEach(thread => {
                  const prev = prevThreadsRef.current[thread.id];
                  // Check if thread updated and message is from someone else
                  if (prev && thread.updatedAt > prev.updatedAt && thread.lastMessageSenderId && thread.lastMessageSenderId !== userProfile.uid) {
                    const isBuzz = typeof thread.lastMessage === 'string' && thread.lastMessage.includes('Buzz');
                    
                    // Trigger Android vibration on Buzz
                    if (isBuzz && "vibrate" in navigator) {
                      navigator.vibrate(1000);
                    }

                    // Trigger OS Notification
                    if (typeof window.Notification !== 'undefined' && window.Notification.permission === 'granted') {
                      if (document.hidden || activeThreadRef.current !== thread.id) {
                        const otherUid = thread.participants.find(id => id !== userProfile.uid);
                        const senderName = thread.participantDetails?.[otherUid] || 'Someone';
                        new window.Notification(`New message from @${senderName}`, {
                          body: thread.lastMessage
                        });
                      }
                    }
                  }
                });
              }
              
              prevThreadsRef.current = myThreads.reduce((acc, t) => {
                acc[t.id] = t;
                return acc;
              }, {});
            }, (err) => console.error("Threads fetch error:", err));
            return () => unsub();
          }, [fbUser, userProfile]);

          // Fetch Messages for Active Thread
          useEffect(() => {
            if (!fbUser || !userProfile || !activeThreadId) {
              setMessages([]);
              return;
            }
            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', `messages_${activeThreadId}`);
            const unsub = onSnapshot(messagesRef, (snap) => {
              const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
              msgs.sort((a, b) => a.timestamp - b.timestamp);
              setMessages(msgs);
              
              const lastMsg = msgs[msgs.length - 1];
              if (lastMsg && lastMsg.isBuzz && lastMsg.senderId !== userProfile.uid && (Date.now() - lastMsg.timestamp < 3000)) {
                triggerBuzz();
              }
            }, (err) => console.error("Messages fetch error:", err));
            return () => unsub();
          }, [fbUser, userProfile, activeThreadId]);

          // Auto-scroll
          useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          }, [messages]);

          // --- Auth Actions ---
          const handleLogout = () => {
            setUserProfile(null);
            setView('inbox');
            setActiveThreadId(null);
            setLoginForm({ username: '', password: '' });
            setAuthScreen('intro');
          };

          const completeLoginSetup = (u) => {
            setUserProfile(u);
            setEditBio(u.bio || '');
            setEditColor(u.avatarColor || 'bg-indigo-600');
            setEditIcon(u.avatarIcon || '');
            setEditCustomImage(u.customAvatarUrl || '');
            setLoginForm({ username: '', password: '' });
            setView('inbox');
          };

          const handleRegister = async (e) => {
            e.preventDefault();
            setAuthError('');
            const { username, password } = loginForm;
            const cleanUsername = username.trim().toLowerCase();
            
            if (!cleanUsername || password.length < 6) {
              setAuthError('Username required, password must be at least 6 characters.');
              return;
            }

            if (allUsers.some(u => u.username === cleanUsername)) {
              setAuthError('Username is already taken.');
              return;
            }

            try {
              const profileUid = `usr_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
              const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', profileUid);
              
              const newProfile = {
                uid: profileUid,
                username: cleanUsername,
                passCode: btoa(password), 
                bio: "Available",
                avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)],
                avatarIcon: AVATAR_ICONS[Math.floor(Math.random() * AVATAR_ICONS.length)],
                customAvatarUrl: "",
                joinedAt: Date.now()
              };

              await setDoc(profileRef, newProfile);
              completeLoginSetup(newProfile);
            } catch (err) {
              console.error("Registration error:", err);
              setAuthError("Could not create account at this time.");
            }
          };

          const handleLogin = async (e) => {
            e.preventDefault();
            setAuthError('');
            const { username, password } = loginForm;
            const cleanUsername = username.trim().toLowerCase();
            
            const foundUser = allUsers.find(u => u.username === cleanUsername);
            
            if (foundUser) {
              if (foundUser.passCode === btoa(password)) {
                // Normal Login Success
                completeLoginSetup(foundUser);
              } else if (!foundUser.passCode) {
                // LEGACY MIGRATION: Old account without a password
                try {
                  const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', foundUser.uid);
                  await updateDoc(profileRef, { passCode: btoa(password) });
                  const updatedUser = { ...foundUser, passCode: btoa(password) };
                  completeLoginSetup(updatedUser);
                } catch (err) {
                  console.error("Migration error:", err);
                  setAuthError('Error updating old account. Try again.');
                }
              } else {
                setAuthError('Invalid username or password.');
              }
            } else {
              setAuthError('Invalid username or password.');
            }
          };

          // Profile Image Upload Compressor
          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                // Create canvas to resize image
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 200;
                const MAX_HEIGHT = 200;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                  if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                  }
                } else {
                  if (height > MAX_HEIGHT) {
                    width *= MAX_HEIGHT / height;
                    height = MAX_HEIGHT;
                  }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // Compress to JPEG to save space in Firestore
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                setEditCustomImage(dataUrl);
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          };

          const handleUpdateProfile = async (e) => {
            e.preventDefault();
            if (!fbUser || !userProfile) return;
            
            try {
              const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', userProfile.uid);
              await updateDoc(profileRef, {
                bio: editBio.trim(),
                avatarColor: editColor,
                avatarIcon: editIcon,
                customAvatarUrl: editCustomImage
              });
              alert("Profile updated successfully!");
            } catch (err) {
              console.error("Profile update error:", err);
            }
          };

          const triggerBuzz = () => {
            setIsBuzzed(true);
            setTimeout(() => setIsBuzzed(false), 800);
          };

          const startChat = async (otherUser) => {
            const threadId = getThreadId(userProfile.uid, otherUser.uid);
            const threadRef = doc(db, 'artifacts', appId, 'public', 'data', 'threads', threadId);
            
            try {
              const snap = await getDoc(threadRef);
              if (!snap.exists()) {
                await setDoc(threadRef, {
                  id: threadId,
                  participants: [userProfile.uid, otherUser.uid],
                  participantDetails: {
                    [userProfile.uid]: userProfile.username,
                    [otherUser.uid]: otherUser.username
                  },
                  updatedAt: Date.now(),
                  lastMessage: "Chat started"
                });
              }
              setActiveThreadId(threadId);
              setView('chat');
              setSearchQuery('');
            } catch (err) {
              console.error("Error starting chat:", err);
            }
          };

          const sendMessage = async (e, type = 'text') => {
            if (e) e.preventDefault();
            if (!activeThreadId || !userProfile) return;
            if (type === 'text' && !messageInput.trim()) return;

            const msgData = {
              senderId: userProfile.uid,
              timestamp: Date.now(),
              type: type,
              text: type === 'text' ? messageInput.trim() : 'Buzzed you!',
              isWhisper: isWhisperMode && type === 'text',
              whisperDuration: whisperTimer,
              isBuzz: type === 'buzz'
            };

            try {
              const msgId = `msg_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
              const msgRef = doc(db, 'artifacts', appId, 'public', 'data', `messages_${activeThreadId}`, msgId);
              await setDoc(msgRef, msgData);

              const threadRef = doc(db, 'artifacts', appId, 'public', 'data', 'threads', activeThreadId);
              await setDoc(threadRef, {
                updatedAt: Date.now(),
                lastMessage: type === 'buzz' ? "⚡ Sent a Buzz!" : (msgData.isWhisper ? "🤫 Sent a whisper" : msgData.text),
                lastMessageSenderId: userProfile.uid
              }, { merge: true });

              setMessageInput('');
              setIsWhisperMode(false);
              if (type === 'buzz') triggerBuzz();
              
            } catch (err) {
              console.error("Error sending message:", err);
            }
          };

          const handleDeleteMessage = async (msgId) => {
            if (!activeThreadId) return;
            try {
              const msgRef = doc(db, 'artifacts', appId, 'public', 'data', `messages_${activeThreadId}`, msgId);
              await deleteDoc(msgRef);
            } catch (err) {
              console.error("Error deleting message:", err);
            }
          };

          const cycleWhisperTimer = () => {
            setWhisperTimer(prev => prev === 5 ? 10 : prev === 10 ? 30 : 5);
          };

          // --- Render Guards ---
          if (!authInitialized || !fbUser) {
            return <div className="min-h-screen bg-slate-950 flex items-center justify-center text-slate-300">Connecting to Nexus Secure Servers...</div>;
          }

          // Pre-login / Intro View
          if (!userProfile) {
            return (
              <div className={`min-h-screen ${themeClasses.bg} flex flex-col items-center justify-center text-white p-4 transition-colors duration-500`}>
                <div className={`${themeClasses.panel} p-8 rounded-2xl border ${themeClasses.border} w-full max-w-md shadow-2xl`}>
                  <div className="flex justify-center mb-6">
                    <div className="bg-indigo-600 p-3 rounded-full relative">
                      <Sparkles size={32} className="text-white" />
                      <div className="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-slate-900" title="Database Connected"></div>
                    </div>
                  </div>
                  
                  <h1 className="text-3xl font-bold text-center mb-2">NexusChat</h1>
                  
                  {authScreen === 'intro' && (
                    <div className="space-y-4 mt-8 animate-in fade-in zoom-in duration-300">
                      <p className="text-slate-400 text-center mb-6">Secure, fast, and globally connected.</p>
                      
                      <div className="flex items-center justify-center gap-2 text-xs text-green-400 mb-6 bg-green-500/10 py-2.5 rounded-lg border border-green-500/20 font-medium">
                        <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                        Database Connection Upgraded & Secure
                      </div>

                      <button 
                        onClick={() => setAuthScreen('register')}
                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl transition-all hover:scale-[1.02] shadow-lg shadow-indigo-600/20"
                      >
                        Create New Account
                      </button>
                      <button 
                        onClick={() => setAuthScreen('login')}
                        className={`w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3.5 rounded-xl transition-all border ${themeClasses.border}`}
                      >
                        Login to Existing Account
                      </button>
                    </div>
                  )}

                  {authScreen === 'register' && (
                    <form onSubmit={handleRegister} className="space-y-4 mt-4 animate-in slide-in-from-right-4 duration-300">
                      <h2 className="text-xl font-semibold text-center mb-4">Create Account</h2>
                      {authError && <div className="p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-xl">{authError}</div>}
                      
                      <input 
                        type="text" 
                        placeholder="Choose a username..." 
                        value={loginForm.username}
                        onChange={(e) => setLoginForm({...loginForm, username: e.target.value})}
                        className={`w-full ${themeClasses.bg} border ${themeClasses.border} text-white px-4 py-3.5 rounded-xl focus:outline-none focus:border-indigo-500 transition-all`}
                        required
                        pattern="[a-zA-Z0-9_]+"
                        title="Only letters, numbers, and underscores allowed"
                      />
                      <div className="relative">
                        <input 
                          type={showPassword ? "text" : "password"} 
                          placeholder="Create a password (min 6 chars)..." 
                          value={loginForm.password}
                          onChange={(e) => setLoginForm({...loginForm, password: e.target.value})}
                          className={`w-full ${themeClasses.bg} border ${themeClasses.border} text-white px-4 py-3.5 pr-12 rounded-xl focus:outline-none focus:border-indigo-500 transition-all`}
                          required
                          minLength={6}
                        />
                        <button 
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                          title={showPassword ? "Hide password" : "Show password"}
                        >

                                    title="Use Initial"

                                    {String(userProfile?.username || '?').charAt(0).toUpperCase()}

                                <div className="flex flex-wrap gap-3">
                                  {AVATAR_COLORS.map(color => (

                                      key={color}
                                      type="button"
                                      onClick={() => setEditColor(color)}
                                      className={`w-12 h-12 rounded-full ${color} flex items-center justify-center transition-transform hover:scale-110 ${editColor === color ? 'ring-4 ring-offset-2 ring-offset-slate-900 ring-indigo-500' : ''}`}
                                    >
                                      {editColor === color && <Check size={20} className="text-white" />}
                                    </button>
                                  ))}
                                </div>
                              </div>
                            </>
                          )}

                          <hr className={`border-${themeClasses.border.split('-')[1]}-800`} />

                          <button 
                            type="submit"
                            className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition-colors w-full sm:w-auto"

                            Save Profile Changes
                          </button>

                    </div>

                      <div className={`${themeClasses.panel} border ${themeClasses.border} rounded-2xl p-6 shadow-xl`}>
                         <h3 className="text-lg font-bold text-white flex items-center gap-2 mb-4"><Bell size={20} /> Notifications</h3>
                         <div className="flex items-center justify-between">
                           <div>
                             <p className="text-slate-200 font-medium">System Notifications</p>
                             <p className="text-xs text-slate-400">Get alerts & vibrations for new messages</p>

                           {notifPermission === 'granted' ? (
                             <span className="px-3 py-1 bg-green-500/20 text-green-400 rounded-lg text-sm font-bold">Enabled</span>
                           ) : (
                             <button 
                               onClick={() => {
                                 if (typeof window.Notification !== 'undefined') {
                                   window.Notification.requestPermission().then(p => setNotifPermission(p));
                                 } else {
                                   alert("Notifications not supported on this browser.");

                               }}
                               className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold transition-colors"
                             >
                               Enable

                      {/* Danger Zone */}
                      <div className={`${themeClasses.panel} border ${themeClasses.border} rounded-2xl p-6 shadow-xl`}>
                         <h3 className="text-lg font-bold text-red-400 mb-4">Account Access</h3>
                         <button 
                            onClick={handleLogout}
                            className="w-full flex justify-center items-center gap-2 bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/30 font-semibold py-3 rounded-xl transition-colors"
                          >
                            <LogOut size={18} /> Sign Out of NexusChat

                      {/* Credits */}
                      <div className={`${themeClasses.panel} border ${themeClasses.border} rounded-2xl p-6 shadow-xl text-center space-y-4`}>
                         <h3 className="text-lg font-bold text-indigo-400 flex items-center justify-center gap-2 mb-4"><Info size={20} /> Credits</h3>
                         <p className="text-slate-300">Proudly Developed By</p>

                            <p>This is the beginning of your chat with {activeOtherUser?.username || 'them'}.</p>
                            <div className={`${themeClasses.panel} p-4 rounded-xl max-w-sm text-sm border ${themeClasses.border} text-center`}>
                              Try sending a <strong>Whisper</strong> (hidden message) or a <strong>Buzz</strong> to get their attention!
                            </div>
                         </div>
                       ) : (
                         messages.map(msg => {
                           const isMe = msg.senderId === userProfile.uid;
                           
                           if (msg.isBuzz) {
                             return (
                               <div key={msg.id} className="w-full flex justify-center my-2 group relative">
                                 <div className="bg-yellow-500/10 border border-yellow-500/30 text-yellow-500 px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-2">
                                   <Zap size={14} /> 
                                   {isMe ? `You buzzed ${activeOtherUser?.username || 'them'}` : `${activeOtherUser?.username || 'Someone'} buzzed you!`}
                                 </div>
                                 {isMe && (
                                   <button 
                                     onClick={() => handleDeleteMessage(msg.id)}
                                     className="absolute right-[calc(50%-100px)] p-1 text-slate-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                                     title="Delete buzz log"
                                   >
                                     <Trash2 size={14} />
                                   </button>
                                 )}
                               </div>
                             )
                           }

                           if (msg.isWhisper) {
                             return <WhisperBubble key={msg.id} msg={msg} currentUserId={userProfile.uid} onDelete={handleDeleteMessage} />;
                           }

                           return (
                             <div key={msg.id} className={`flex flex-col max-w-[75%] ${isMe ? 'self-end items-end' : 'self-start items-start'} my-0.5 group relative`}>
                                <div className={`px-4 py-2.5 rounded-2xl ${
                                  isMe 
                                    ? `${userProfile?.avatarColor || 'bg-indigo-600'} text-white rounded-tr-sm shadow-sm` 
                                    : `${themeClasses.panel} text-slate-200 border ${themeClasses.border} rounded-tl-sm shadow-sm`
                                }`}>
                                  <p className="break-words">{typeof msg.text === 'string' ? msg.text : String(msg.text)}</p>
                                </div>
                                {isMe && (
                                  <button 
                                    onClick={() => handleDeleteMessage(msg.id)}
                                    className="absolute -left-10 top-1/2 -translate-y-1/2 p-2 text-slate-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                                    title="Delete message"
                                  >
                                    <Trash2 size={16} />
                                  </button>
                                )}
                             </div>
                           );
                         })
                       )}
                       <div ref={messagesEndRef} />
                    </div>

                    {/* Input Area */}
                    <div className={`p-3 sm:p-4 ${themeClasses.panel} border-t ${themeClasses.border}`}>
                      <form onSubmit={(e) => sendMessage(e, 'text')} className="flex items-end gap-2">
                        <button 
                          type="button"
                          onClick={() => setIsWhisperMode(!isWhisperMode)}
                          className={`p-3 rounded-xl transition-all ${isWhisperMode ? 'bg-purple-600 text-white shadow-[0_0_15px_rgba(147,51,234,0.5)]' : 'bg-black/20 text-slate-400 hover:text-white'}`}
                          title="Whisper Mode (Self-destructing message)"
                        >
                          <EyeOff size={20} />
                        </button>
                        {isWhisperMode && (
                           <button 
                             type="button"
                             onClick={cycleWhisperTimer}
                             className="p-3 bg-purple-900/50 border border-purple-500/30 text-purple-200 rounded-xl font-bold flex items-center justify-center min-w-[3rem] transition-colors hover:bg-purple-800/60"
                             title="Whisper Duration"
                           >
                             {whisperTimer}s
                           </button>
                        )}
                        <div className="flex-1 relative">
                          <input 
                            type="text" 
                            value={messageInput}
                            onChange={(e) => setMessageInput(e.target.value)}
                            placeholder={isWhisperMode ? `Type a secret whisper (${whisperTimer}s)...` : "Type a message..."}
                            className={`w-full ${themeClasses.bg} border rounded-xl py-3 px-4 focus:outline-none transition-all ${
                              isWhisperMode 
                                ? 'border-purple-500/50 focus:border-purple-500 text-purple-100 placeholder-purple-500/50' 
                                : `${themeClasses.border} focus:border-indigo-500 text-white`
                            }`}
                          />
                        </div>
                        <button 
                          type="submit"
                          disabled={!messageInput.trim()}
                          className={`p-3 ${userProfile?.avatarColor?.replace('bg-', 'bg-').replace('-600', '-600') || 'bg-indigo-600'} hover:opacity-80 disabled:bg-slate-800 disabled:text-slate-500 text-white rounded-xl transition-all flex items-center justify-center`}
                        >
                          <Send size={20} />
                        </button>
                      </form>
                      {isWhisperMode && (
                        <div className="text-xs text-purple-400 mt-2 ml-2 flex items-center gap-1">
                          <Sparkles size={10} /> Whisper will be permanently deleted {whisperTimer} seconds after being opened.
                        </div>
                      )}
                    </div>

                  </div>
                ) : 
                
                /* VIEW: EMPTY STATE (Inbox but no chat selected on wide screens) */
                (
                  <div className="flex-1 flex flex-col items-center justify-center text-slate-500 hidden md:flex">
                     <div className={`w-24 h-24 border-2 border-dashed ${themeClasses.border} rounded-full flex items-center justify-center mb-6`}>
                       <MessageSquare size={40} className="text-slate-600" />
                     </div>
                     <h2 className="text-xl font-bold text-slate-400 mb-2">NexusChat for Web</h2>
                     <p className="text-sm max-w-md text-center">Select a chat from the sidebar or search for a username to start a new encrypted conversation.</p>
                  </div>
                )}
              </div>

            </div>
          );
        }

        // --- Render Application ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js')})}</script>
</body>
</html>
